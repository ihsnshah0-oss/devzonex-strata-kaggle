name: PSX portal probe

# Diagnostic only: asks the PSX Data Portal what its current endpoints are and
# commits the answer, so the ingester can be pointed at the right routes instead
# of guessing (or, worse, switching to a third-party data source).

on:
  push:
    branches: ["arena/**"]
    paths:
      - "data/probe-trigger.txt"
      - "scripts/psx_probe.py"
      - ".github/workflows/psx-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip httpx
      - name: Probe
        run: |
          set -o pipefail
          python scripts/psx_probe.py --out data/probe.json | tee data/probe.log
      - name: Commit the probe report
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "psx-ingest-bot"
          git config user.email "psx-ingest-bot@users.noreply.github.com"
          git add -f data/probe.json data/probe.log
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "PSX portal probe $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push origin "HEAD:$BRANCH"
          fi
