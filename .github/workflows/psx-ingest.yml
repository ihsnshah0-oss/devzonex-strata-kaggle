name: PSX portal ingest

# Pulls KSE100 / KMI30 data straight from the PSX Data Portal
# (https://dps.psx.com.pk) into a SQLite database.
#
# The portal is the ONLY data source. This runner is just a machine with
# outbound internet access; no third-party market-data provider is involved.
# The database is uploaded as an artifact and also committed back to the branch
# (gzipped) so it can be inspected without the Actions UI.

on:
  push:
    branches: ["arena/**"]
    paths:
      - "data/ingest-trigger.txt"
      - ".github/workflows/psx-ingest.yml"
  workflow_dispatch:
    inputs:
      indices:
        description: "Comma-separated index codes"
        default: "KSE100,KMI30"
        required: false
      company_pages:
        description: "Fetch /company/{symbol} pages (true/false)"
        default: "true"
        required: false

permissions:
  contents: write

concurrency:
  group: psx-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx pytest

      - name: Offline self-check (parsers, store, capture replay)
        run: python -m pytest tests/test_psxdb.py -q

      - name: Initialise database
        run: python -m strata_research.psxdb init --db data/psx.db

      - name: Ingest from the PSX Data Portal
        id: ingest
        continue-on-error: true
        env:
          INDICES: ${{ github.event.inputs.indices || 'KSE100,KMI30' }}
          COMPANY: ${{ github.event.inputs.company_pages || 'true' }}
        run: |
          set -o pipefail
          FLAGS=""
          if [ "$COMPANY" = "false" ]; then FLAGS="--no-company"; fi
          python -m strata_research.psxdb ingest \
            --db data/psx.db \
            --indices "$INDICES" \
            --workers 2 \
            --interval 0.4 \
            --capture-dir captures/latest \
            --json $FLAGS > data/ingest-report.json 2> data/ingest.log
          echo "ingest_exit=$?" | tee -a data/ingest.log
          cat data/ingest.log || true

      - name: Summarise
        if: always()
        run: |
          {
            echo "### PSX ingest"
            echo '```'
            python -m strata_research.psxdb stats --db data/psx.db || true
            python -m strata_research.psxdb constituents KSE100 --db data/psx.db | head -12 || true
            python -m strata_research.psxdb constituents KMI30 --db data/psx.db | head -12 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 data/ingest.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Package the database
        if: always()
        run: |
          du -h data/psx.db || true
          gzip -9 -c data/psx.db > data/psx.db.gz || true
          du -h data/psx.db.gz || true
          du -sh captures/latest 2>/dev/null || true

      - name: Commit the database back to the branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "psx-ingest-bot"
          git config user.email "psx-ingest-bot@users.noreply.github.com"
          git add -f data/psx.db.gz data/ingest-report.json data/ingest.log
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "PSX ingest $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psx-db
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/psx.db
            data/psx.db.gz
            data/ingest-report.json
            data/ingest.log

      - name: Upload raw capture (provenance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psx-capture
          if-no-files-found: warn
          retention-days: 14
          path: captures/latest/

      - name: Fail the job if the ingest failed
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "ingest step failed; see data/ingest.log"
          exit 1
