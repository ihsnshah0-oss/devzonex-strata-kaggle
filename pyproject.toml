[project]
name = "devzonex-strata-kaggle"
version = "0.2.0"
description = "Guided Kaggle GPU setup for Strata models, plus a team of LLM research agents on a Python backend"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DevZoneX" }]
keywords = ["strata", "kaggle", "llm", "agents", "equity-research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests>=2.31.0", "kaggle>=2.2.5"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.26"]
live = ["yfinance>=0.2.40"]
dev = ["pytest>=7.4", "httpx>=0.26", "fastapi>=0.110", "uvicorn>=0.27"]
all = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.26", "yfinance>=0.2.40"]

[project.scripts]
strata-research = "strata_research.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["strata_research*", "scripts*"]

[tool.setuptools.package-data]
strata_research = ["ui/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
